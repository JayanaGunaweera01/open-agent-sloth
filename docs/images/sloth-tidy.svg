<svg xmlns="http://www.w3.org/2000/svg" width="900" height="368" viewBox="0 0 900 368" role="img" aria-label="openagent sloth tidy: dry run, apply, undo">
<title>openagent sloth tidy: dry run, apply, undo</title>
<rect width="900" height="368" rx="12" fill="#1e1f22"/>
<path d="M0 12a12 12 0 0 1 12-12h876a12 12 0 0 1 12 12v24H0z" fill="#2b2d31"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="84" y="22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#9a9da3">openagent sloth tidy: dry run, apply, undo</text>
<text x="18" y="70" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><tspan fill="#7fd6a4">$ </tspan><tspan fill="#d8dae0">openagent sloth tidy ~/Downloads</tspan></text>
<text x="18" y="91" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><tspan fill="#d8dae0">  IMG_2041.jpg  -&gt;  Images/IMG_2041.jpg</tspan></text>
<text x="18" y="112" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><tspan fill="#d8dae0">  invoice march.pdf  -&gt;  Invoices/invoice_march.pdf</tspan></text>
<text x="18" y="133" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><tspan fill="#d8dae0">  notes.txt  -&gt;  Documents/notes.txt</tspan></text>
<text x="18" y="154" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><tspan fill="#d8dae0">  report-final (1).docx  -&gt;  Documents/report-final_1.docx</tspan></text>
<text x="18" y="175" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><tspan fill="#d8dae0">  setup.zip  -&gt;  Archives/setup.zip</tspan></text>
<text x="18" y="196" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><tspan fill="#d8dae0"></tspan></text>
<text x="18" y="217" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><tspan fill="#e6c07b">5 file(s) would move. Re-run with --apply to do it (undo with: openagent sloth undo ~/Downloads).</tspan></text>
<text x="18" y="238" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><tspan fill="#d8dae0"></tspan></text>
<text x="18" y="259" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><tspan fill="#7fd6a4">$ </tspan><tspan fill="#d8dae0">openagent sloth tidy ~/Downloads</tspan><tspan fill="#8ab4f8"> --apply</tspan></text>
<text x="18" y="280" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><tspan fill="#7fd6a4">Moved 5 file(s).</tspan></text>
<text x="18" y="301" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><tspan fill="#d8dae0"></tspan></text>
<text x="18" y="322" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><tspan fill="#7fd6a4">$ </tspan><tspan fill="#d8dae0">openagent sloth undo ~/Downloads</tspan></text>
<text x="18" y="343" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><tspan fill="#7fd6a4">Put 5 file(s) back.</tspan></text>
</svg>